name: Deploy FinTrack Production

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Home Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # Navigate to production deployment directory
            cd ~/fintrack || mkdir -p ~/fintrack && cd ~/fintrack

            # If the repository isn't cloned on the host yet, initialize it
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Fetch latest release branch code
            git fetch origin
            git checkout release
            git reset --hard origin/release

            # Inject the production environment variables (using server's local template)
            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo "Please configure the production .env file on the host machine before proceeding."
              exit 1
            fi

            # Start the containers or update configuration definitions
            docker compose -f docker-compose.prod.yml up -d --build

            # Execute production optimization commands inside the running web container
            docker exec fintrack_prod_web composer install --no-dev --optimize-autoloader --no-interaction
            docker exec fintrack_prod_web php artisan config:cache
            docker exec fintrack_prod_web php artisan route:cache
            docker exec fintrack_prod_web php artisan view:cache
            
            # Safely run database migrations against your 3rd party host
            docker exec fintrack_prod_web php artisan migrate --force