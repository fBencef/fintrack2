name: Deploy FinTrack Production

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          # 1. Ensure directory exists and has the git repository
          if [ ! -d "$HOME/fintrack/.git" ]; then
            mkdir -p "$HOME/fintrack"
            git clone -b release https://github.com/fBencef/fintrack2.git "$HOME/fintrack"
          fi

          cd "$HOME/fintrack" || exit 1

          # 2. Pull the latest release code
          git fetch origin release
          git checkout release
          git reset --hard origin/release

          # 3. Ensure the production compose file and .env exist
          if [ ! -f ".env" ]; then
            echo "Error: .env file missing in $HOME/fintrack!"
            exit 1
          fi

          # 4. Spin up the FrankenPHP container
          docker compose -f docker-compose.prod.yml up -d --build

          # 5. Run Composer install using official Composer Docker image
          docker run --rm \
            -v "$HOME/fintrack:/app" \
            -w /app \
            composer:latest install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

          # 6. Build production frontend assets (Tailwind / Vite)
          docker run --rm \
            -v "$HOME/fintrack:/app" \
            -w /app \
            node:20-alpine sh -c "npm ci && npm run build"

          # 7. Production optimisations & migrations inside FrankenPHP
          docker exec fintrack_prod_web php artisan config:cache
          docker exec fintrack_prod_web php artisan route:cache
          docker exec fintrack_prod_web php artisan view:cache
          docker exec fintrack_prod_web php artisan migrate --force