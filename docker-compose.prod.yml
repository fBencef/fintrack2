services:
  web:
    container_name: fintrack_prod_web
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SERVER_NAME: ":80"
      APP_RUNTIME: "Runtime\\FrankenPhpSymfony\\Runtime"
    volumes:
      - ./:/app
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache